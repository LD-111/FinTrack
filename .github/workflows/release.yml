name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Require the tag to match the app version
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const tag = process.env.GITHUB_REF_NAME?.replace(/^v/, "") ?? "";
          const version = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          if (!cargo || tag !== version || pkg !== version || cargo !== version) {
            console.error("Tag does not match the app version.", { tag, version, pkg, cargo });
            process.exit(1);
          }
          console.log(`Release ${version}`);
          EOF

      - name: install frontend dependencies
        run: npm ci

      - name: test
        run: npm test

  publish:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      FINTRACK_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FinTrack v__VERSION__
          releaseBody: |
            Installers for this version:

            - Windows: the setup `.exe`, or the `.msi`
            - macOS: the `.dmg` for Apple silicon (`aarch64`) or Intel (`x64`)
            - Linux: the `.AppImage`, or the `.deb` / `.rpm` package

            The in-app update is optional. FinTrack can stay on this version.

            The installers are unsigned. Windows SmartScreen and macOS Gatekeeper ask you to confirm the first launch.
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
